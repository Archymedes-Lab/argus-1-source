# Drop-in for jarvis.service — /etc/systemd/system/jarvis.service.d/service-user.conf
#
# PROTECTION-REVIEW-2026-10-21 F2: the daemon used to run as the account it
# protects, so anything running as that account could stop it, freeze it, or
# rewrite its store, config and acknowledgements. This drop-in moves the
# daemon to its own system user with its state under /var/lib/jarvis and its
# config under /etc/jarvis, and locks the filesystem view down to what it
# needs. Installed by scripts/repair/install-service-user.sh, which also
# migrates the state and refuses to switch unless Windows interop works for
# the new user (the daemon is nothing without PowerShell).
#
# What stays open by design: /mnt/c (the Windows disk is the thing being
# watched; DrvFs grants the new user read access and the specific writable
# folders JARVIS owns on the Windows side), and the loopback API.
[Service]
User=jarvis
Group=jarvis
SupplementaryGroups=jarvis-readers
Environment=HOME=/var/lib/jarvis
Environment=JARVIS_HOME=/var/lib/jarvis
Environment=JARVIS_CONFIG=/etc/jarvis/config.json
ProtectSystem=strict
ProtectHome=read-only
ReadWritePaths=/var/lib/jarvis /run/jarvis /mnt/c/Users/chris/AppData/Local/Jarvis /mnt/c/ProgramData/Jarvis/Sensor/acks
RuntimeDirectory=jarvis
RuntimeDirectoryMode=0750
StateDirectory=jarvis
StateDirectoryMode=0750
NoNewPrivileges=yes
PrivateTmp=yes
# The capability set the release already asks for (read the Windows disk,
# ptrace-free process inspection, syslog); nothing beyond it.
AmbientCapabilities=CAP_DAC_READ_SEARCH CAP_SYS_PTRACE CAP_SYSLOG
CapabilityBoundingSet=CAP_DAC_READ_SEARCH CAP_SYS_PTRACE CAP_SYSLOG
