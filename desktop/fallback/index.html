<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>JARVIS — waiting for the daemon</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center;
         background: #0b1220; color: #cbd5e1; font: 15px/1.6 system-ui, sans-serif; }
  main { max-width: 34rem; padding: 2rem; }
  h1 { font-weight: 500; font-size: 1.3rem; color: #e2e8f0; margin: 0 0 .6rem; }
  code { background: #111c30; border: 1px solid #1c2c46; border-radius: 4px; padding: 1px 6px; }
  .dot { display: inline-block; width: .6rem; height: .6rem; border-radius: 50%;
         background: #64748b; margin-right: .5rem; }
</style>
</head>
<body>
<main>
  <h1><span class="dot"></span>JARVIS daemon not reachable</h1>
  <p>This window shows what the JARVIS daemon sees. It found nothing at
     <code>127.0.0.1:8787</code>, so nothing is being shown, and this does
     <strong>not</strong> mean the machine is clean.</p>
  <p>Start the daemon with <code>jarvis serve</code> (or its service), and
     this window switches to the dashboard on its own.</p>
</main>
</body>
</html>
