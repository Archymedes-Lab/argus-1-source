[package]
name = "jarvis-desktop"
version = "1.0.0"
edition = "2021"
description = "JARVIS desktop shell: window, tray and notifications over the local daemon"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-notification = "2"
tauri-plugin-single-instance = "2"
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
