name: Release build

# Pushing a tag vYYYY.MM.DD[-N] on a commit of main builds a release. Nothing
# here can publish: the result is a DRAFT GitHub Release in this private
# repository, which a releaser checks and signs on their own machine
# (release/sign.py) before publishing it (publish.yml). Every build runs on a
# clean GitHub runner from the tagged commit only; no laptop builds ship.
#
# Stages: verify (static gate + unit suite) -> build (native server in the
# pinned manylinux_2_28 image, native Windows engine, desktop for Linux and
# Windows, then the Windows Setup from the engine and the desktop app) ->
# install tests (the server package on a real systemd host; the Windows Setup
# on a clean Windows host without WSL) -> assemble (manifest, SHA256SUMS,
# report, SBOM, content gate) -> draft release.
#
# A push to a release-test/* branch runs every stage except the draft: a dry
# run for changing the build itself.
on:
  push:
    tags: ["v*"]
    branches: ["release-test/**"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  RUST_VERSION: "1.97.1"
  BUN_VERSION: "1.3.14"

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Tag names a version and a commit on main
        id: v
        run: |
          if [ "$GITHUB_REF_TYPE" != tag ]; then
            echo "dry run from $GITHUB_REF_NAME: no draft will be made"
            echo "version=$(date -u +%Y.%m.%d)-0" >> "$GITHUB_OUTPUT"; exit 0
          fi
          tag="$GITHUB_REF_NAME"
          [[ "$tag" =~ ^v20[0-9]{2}\.[01][0-9]\.[0-3][0-9](-[0-9]+)?$ ]] || { echo "tag $tag is not vYYYY.MM.DD[-N]"; exit 1; }
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "$GITHUB_SHA is not on main: merge first, then tag"; exit 1; }
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: Runtime dependencies (pinned by hash)
        run: python -m pip install --disable-pip-version-check --require-hashes -r release/requirements-runtime.txt
      - run: scripts/dev/static_gate.sh
      - run: python scripts/dev/ci_suite.py
      - name: Host-bound tests were run on their host and signed by a releaser
        if: github.ref_type == 'tag'
        env:
          ARGUS_RELEASE_SIGNERS: ${{ vars.ARGUS_RELEASE_SIGNERS }}
        run: python release/host_attest.py check

  # Builds pass between jobs through the Actions cache: it costs no account
  # storage and needs no write token. Each build job records its files'
  # SHA-256 as a job output, which only it can set; every consumer restores
  # the entry and checks it against those digests (release/digests.py).
  server:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    outputs:
      digests: ${{ steps.digests.outputs.server }}
      key: ${{ steps.digests.outputs.server_key }}
    env:
      # glibc 2.28: the program runs on RHEL 8+, Debian 10+, Ubuntu 20.04+. The
      # build runs in this image through `docker run`, not as a job container,
      # so the cache below is saved by the runner (a job container's cache uses
      # its own compression and cannot be restored on the runner).
      IMAGE: quay.io/pypa/manylinux_2_28_x86_64@sha256:4131ddd7acb9c6c966af02fe7e71edc51e078c2d41f475966697676430bfa2ae # 2026.10.10-1
      VERSION: ${{ needs.verify.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Native server program (in the pinned manylinux image, no network credentials)
        run: |
          docker run --rm -e VERSION -v "$PWD:/src" -w /src "$IMAGE" bash -euo pipefail -c '
            PY=/opt/python/cp312-cp312/bin/python
            git config --global --add safe.directory /src
            (cd /opt/_internal && tar xf static-libs-for-embedding-only.tar.xz)
            $PY -m pip install --disable-pip-version-check --require-hashes -r release/build-tools.txt
            $PY -m pip install --disable-pip-version-check --require-hashes --no-build-isolation -r release/requirements-build.txt
            $PY release/build_server.py --version "$VERSION" --out out/server --jobs 4
            chown -R '"$(id -u):$(id -g)"' out'
      - name: Record the build's digests
        id: digests
        run: python3 release/digests.py record out/server server
      - uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: out/server
          key: ${{ steps.digests.outputs.server_key }}
          enableCrossOsArchive: true

  server-install-test:
    needs: [verify, server]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: out/server
          key: ${{ needs.server.outputs.key }}
          enableCrossOsArchive: true
          fail-on-cache-miss: true
      - name: The packages are the ones the server build recorded
        env:
          DIGESTS: ${{ needs.server.outputs.digests }}
        run: |
          python3 release/digests.py verify out/server "$DIGESTS"
          mkdir -p server && cp out/server/*.tar.gz out/server/*.deb server/
      - name: Install, run, observe, remove (a real systemd host)
        run: sudo bash release/install_test.sh server/argus-server-linux-x86_64.tar.gz server/argus-server_*_amd64.deb

  desktop-linux:
    needs: verify
    outputs:
      digests: ${{ steps.digests.outputs.desktop_linux }}
      key: ${{ steps.digests.outputs.desktop_linux_key }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Toolchain and WebKitGTK
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustup default "$RUST_VERSION"
      - run: python3 release/build_desktop.py --platform linux --version "${{ needs.verify.outputs.version }}" --out out/desktop-linux
      - name: Record the build's digests
        id: digests
        shell: bash
        run: python3 release/digests.py record out/desktop-linux desktop_linux
      - uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: out/desktop-linux
          key: ${{ steps.digests.outputs.desktop_linux_key }}
          enableCrossOsArchive: true

  desktop-windows:
    needs: verify
    outputs:
      digests: ${{ steps.digests.outputs.desktop_windows }}
      key: ${{ steps.digests.outputs.desktop_windows_key }}
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Toolchain
        run: |
          rustup toolchain install $env:RUST_VERSION --profile minimal
          rustup default $env:RUST_VERSION
      - run: python release/build_desktop.py --platform windows --version "${{ needs.verify.outputs.version }}" --out out/desktop-windows
      - name: Record the build's digests
        id: digests
        shell: bash
        run: python release/digests.py record out/desktop-windows desktop_windows
      - uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: out/desktop-windows
          key: ${{ steps.digests.outputs.desktop_windows_key }}
          enableCrossOsArchive: true

  # The Windows edition: the same code compiled natively on Windows, with its
  # PowerShell payloads compiled in (release/build_windows.py). Built in a
  # neutral folder: the content gate refuses runner home and workspace paths.
  engine-windows:
    needs: verify
    outputs:
      digests: ${{ steps.digests.outputs.engine_windows }}
      key: ${{ steps.digests.outputs.engine_windows_key }}
    runs-on: windows-2025
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Build tools (pinned by hash)
        run: |
          python -m pip install --disable-pip-version-check --require-hashes -r release/build-tools.txt
          python -m pip install --disable-pip-version-check --require-hashes --no-build-isolation -r release/requirements-build.txt
      # Nuitka's built-in clcache keeps MSVC object files keyed by compiler,
      # flags and source, so a stale entry can only miss, never change code.
      # Persisted across dry runs (measured elsewhere: 17.4 -> 6.0 min warm);
      # tagged releases build cold. Reset above 2 GiB: clcache never prunes.
      - name: Restore the compiler cache (dry runs only)
        if: github.ref_type != 'tag'
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: C:\nuitka-cache
          key: nuitka-windows-${{ github.sha }}
          restore-keys: nuitka-windows-
      - name: Keep the compiler cache bounded
        if: github.ref_type != 'tag'
        run: |
          if (Test-Path C:\nuitka-cache) {
            $size = (Get-ChildItem C:\nuitka-cache -Recurse -File | Measure-Object Length -Sum).Sum
            Write-Host ("compiler cache: {0:N0} MB" -f ($size / 1MB))
            if ($size -gt 2GB) { Remove-Item C:\nuitka-cache -Recurse -Force; Write-Host "over 2 GiB: reset" }
          }
      # Nuitka's tips: real-time scanning of the build folders slows MSVC builds.
      # A disposable runner; only these two build folders are excluded.
      - name: Keep Defender out of the build folders
        run: |
          $mp = Get-MpComputerStatus -ErrorAction SilentlyContinue
          Write-Host "Defender real-time protection: $(if ($mp) { $mp.RealTimeProtectionEnabled } else { 'not present' })"
          if ($mp -and $mp.RealTimeProtectionEnabled) {
            Add-MpPreference -ExclusionPath C:\argus-build, C:\nuitka-cache, $env:RUNNER_TEMP
          }
      - name: Native Windows engine
        env:
          NUITKA_CACHE_DIR: ${{ github.ref_type == 'tag' && format('{0}\nuitka-cold', runner.temp) || 'C:\nuitka-cache' }}
        run: python release/build_windows.py --version "${{ needs.verify.outputs.version }}" --out out/engine-windows --work C:\argus-build --jobs 4
      - name: Save the compiler cache (dry runs only, also after a failed build)
        if: always() && github.ref_type != 'tag'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: C:\nuitka-cache
          key: nuitka-windows-${{ github.sha }}
      - name: Record the build's digests
        id: digests
        shell: bash
        run: python release/digests.py record out/engine-windows engine_windows
      - uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: out/engine-windows
          key: ${{ steps.digests.outputs.engine_windows_key }}
          enableCrossOsArchive: true

  windows-setup:
    needs: [verify, engine-windows, desktop-windows]
    outputs:
      digests: ${{ steps.digests.outputs.windows_setup }}
      key: ${{ steps.digests.outputs.windows_setup_key }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: out/engine-windows
          key: ${{ needs.engine-windows.outputs.key }}
          enableCrossOsArchive: true
          fail-on-cache-miss: true
      - uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: out/desktop-windows
          key: ${{ needs.desktop-windows.outputs.key }}
          enableCrossOsArchive: true
          fail-on-cache-miss: true
      - name: Both inputs are exactly what their builds recorded
        env:
          ENGINE: ${{ needs.engine-windows.outputs.digests }}
          DESKTOP: ${{ needs.desktop-windows.outputs.digests }}
        run: |
          python3 release/digests.py verify out/engine-windows "$ENGINE"
          python3 release/digests.py verify out/desktop-windows "$DESKTOP"
      - name: makensis and 7-Zip (the gate opens the Setup with 7z)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q nsis 7zip
      - run: python3 release/build_setup.py --engine out/engine-windows --desktop out/desktop-windows --version "${{ needs.verify.outputs.version }}" --out out/windows-setup
      - name: Record the build's digests
        id: digests
        run: python3 release/digests.py record out/windows-setup windows_setup
      - uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: out/windows-setup
          key: ${{ steps.digests.outputs.windows_setup_key }}
          enableCrossOsArchive: true

  windows-install-test:
    needs: [windows-setup]
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: out/windows-setup
          key: ${{ needs.windows-setup.outputs.key }}
          enableCrossOsArchive: true
          fail-on-cache-miss: true
      - name: The Setup is the one its build recorded
        shell: bash
        env:
          DIGESTS: ${{ needs.windows-setup.outputs.digests }}
        run: python release/digests.py verify out/windows-setup "$DIGESTS"
      - name: Install, run, observe, remove (a clean Windows host without WSL)
        run: powershell -NoProfile -ExecutionPolicy Bypass -File release/windows/install_test.ps1 -Setup out/windows-setup/ARGUS-INSTINCT-Setup-windows-x64.exe

  draft:
    needs: [verify, server, server-install-test, desktop-linux, desktop-windows, engine-windows, windows-setup, windows-install-test]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write   # only this job, only to create the draft release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: out/server
          key: ${{ needs.server.outputs.key }}
          enableCrossOsArchive: true
          fail-on-cache-miss: true
      - uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: out/desktop-linux
          key: ${{ needs.desktop-linux.outputs.key }}
          enableCrossOsArchive: true
          fail-on-cache-miss: true
      - uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: out/desktop-windows
          key: ${{ needs.desktop-windows.outputs.key }}
          enableCrossOsArchive: true
          fail-on-cache-miss: true
      - uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: out/engine-windows
          key: ${{ needs.engine-windows.outputs.key }}
          enableCrossOsArchive: true
          fail-on-cache-miss: true
      - uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: out/windows-setup
          key: ${{ needs.windows-setup.outputs.key }}
          enableCrossOsArchive: true
          fail-on-cache-miss: true
      - name: Every file is exactly what its build recorded
        env:
          SERVER: ${{ needs.server.outputs.digests }}
          LINUX: ${{ needs.desktop-linux.outputs.digests }}
          WINDOWS: ${{ needs.desktop-windows.outputs.digests }}
          ENGINE: ${{ needs.engine-windows.outputs.digests }}
          SETUP: ${{ needs.windows-setup.outputs.digests }}
        run: |
          python3 release/digests.py verify out/server "$SERVER"
          python3 release/digests.py verify out/desktop-linux "$LINUX"
          python3 release/digests.py verify out/desktop-windows "$WINDOWS"
          python3 release/digests.py verify out/engine-windows "$ENGINE"
          python3 release/digests.py verify out/windows-setup "$SETUP"
      - name: 7-Zip (the gate opens the Windows Setup with 7z)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q 7zip
      - name: Assemble and gate
        run: |
          python3 release/assemble.py --builds out --out release-out \
            --version "${{ needs.verify.outputs.version }}" --tag "$GITHUB_REF_NAME" --commit "$GITHUB_SHA" \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --previous https://www.archymedes.xyz/downloads/argus/manifest.json
          cat release-out/release-report.md >> "$GITHUB_STEP_SUMMARY"
      # Owner decision 2026-11-03: a dry run hands its assembled, gated release
      # folder to the owner as a private one-day workflow artifact, so it can be
      # published straight to the site without the tag/sign/publish flow.
      - name: Hand the assembled release to the owner (dry runs only)
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-out
          path: release-out/
          retention-days: 1
          if-no-files-found: error
      - name: Draft release (unsigned, unpublished)
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --draft --verify-tag \
            --title "Argus ${{ needs.verify.outputs.version }}" --notes-file release-out/release-report.md \
            release-out/*
          echo "Draft ready. A releaser signs it: python3 release/sign.py $GITHUB_REF_NAME" >> "$GITHUB_STEP_SUMMARY"
