name: Release build

# Pushing a tag vYYYY.MM.DD[-N] on a commit of main builds a release. Nothing
# here can publish: the result is a DRAFT GitHub Release in this private
# repository, which a releaser checks and signs on their own machine
# (release/sign.py) before publishing it (publish.yml). Every build runs on a
# clean GitHub runner from the tagged commit only; no laptop builds ship.
#
# Stages: verify (static gate + unit suite) -> stage (a temporary private
# draft that carries builds between jobs) -> build (native server in the
# pinned manylinux_2_28 image, desktop for Linux and Windows) -> install test
# (the server package installed and run on a real systemd host) -> assemble
# (manifest, SHA256SUMS, report, SBOM, content gate) -> draft release.
#
# A push to a release-test/* branch runs every stage except the draft: a dry
# run for changing the build itself.
on:
  push:
    tags: ["v*"]
    branches: ["release-test/**"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  RUST_VERSION: "1.97.1"
  BUN_VERSION: "1.3.14"
  # Builds pass between jobs through this temporary draft release, not Actions
  # artifacts (account storage quota); release/stage.py, deleted by `cleanup`.
  STAGE: staging-${{ github.run_id }}

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Tag names a version and a commit on main
        id: v
        run: |
          if [ "$GITHUB_REF_TYPE" != tag ]; then
            echo "dry run from $GITHUB_REF_NAME: no draft will be made"
            echo "version=$(date -u +%Y.%m.%d)-0" >> "$GITHUB_OUTPUT"; exit 0
          fi
          tag="$GITHUB_REF_NAME"
          [[ "$tag" =~ ^v20[0-9]{2}\.[01][0-9]\.[0-3][0-9](-[0-9]+)?$ ]] || { echo "tag $tag is not vYYYY.MM.DD[-N]"; exit 1; }
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "$GITHUB_SHA is not on main: merge first, then tag"; exit 1; }
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: Runtime dependencies (pinned by hash)
        run: python -m pip install --disable-pip-version-check --require-hashes -r release/requirements-runtime.txt
      - run: scripts/dev/static_gate.sh
      - run: python scripts/dev/ci_suite.py
      - name: Host-bound tests were run on their host and signed by a releaser
        if: github.ref_type == 'tag'
        env:
          ARGUS_RELEASE_SIGNERS: ${{ vars.ARGUS_RELEASE_SIGNERS }}
        run: python release/host_attest.py check

  stage:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write   # create the staging draft only
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 release/stage.py create --name "$STAGE" --sha "$GITHUB_SHA"
        env:
          GITHUB_TOKEN: ${{ github.token }}

  server:
    needs: [verify, stage]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: write   # upload to the staging draft (release/stage.py)
    container:
      # glibc 2.28: the program runs on RHEL 8+, Debian 10+, Ubuntu 20.04+.
      image: quay.io/pypa/manylinux_2_28_x86_64@sha256:4131ddd7acb9c6c966af02fe7e71edc51e078c2d41f475966697676430bfa2ae # 2026.10.10-1
    env:
      PY: /opt/python/cp312-cp312/bin/python
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build tools (pinned by hash)
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          $PY -m pip install --disable-pip-version-check --require-hashes -r release/build-tools.txt
          $PY -m pip install --disable-pip-version-check --require-hashes --no-build-isolation -r release/requirements-build.txt
      - name: Static libpython for Nuitka (supplied by the pinned image)
        run: cd /opt/_internal && tar xf static-libs-for-embedding-only.tar.xz
      - name: Native server program
        run: $PY release/build_server.py --version "${{ needs.verify.outputs.version }}" --out out/server --jobs 4
      - name: Stage the server packages and the Nuitka report
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: $PY release/stage.py upload --name "$STAGE" out/server/*.tar.gz out/server/*.deb out/server/server-build.json out/server/nuitka-report.xml

  server-install-test:
    needs: [verify, stage, server]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      # Draft releases are visible only to tokens that can write; the token is
      # given to the download step alone, never to the install that follows.
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Fetch the staged server packages
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 release/stage.py download --name "$STAGE" --dir server
      - name: Install, run, observe, remove (a real systemd host)
        run: sudo bash release/install_test.sh server/argus-server-linux-x86_64.tar.gz server/argus-server_*_amd64.deb

  desktop-linux:
    needs: [verify, stage]
    permissions:
      contents: write   # upload to the staging draft (release/stage.py)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Toolchain and WebKitGTK
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustup default "$RUST_VERSION"
      - run: python3 release/build_desktop.py --platform linux --version "${{ needs.verify.outputs.version }}" --out out/desktop-linux
      - name: Stage the desktop build
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: python3 release/stage.py upload --name "$STAGE" out/desktop-linux/*

  desktop-windows:
    needs: [verify, stage]
    permissions:
      contents: write   # upload to the staging draft (release/stage.py)
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Toolchain
        run: |
          rustup toolchain install $env:RUST_VERSION --profile minimal
          rustup default $env:RUST_VERSION
      - run: python release/build_desktop.py --platform windows --version "${{ needs.verify.outputs.version }}" --out out/desktop-windows
      - name: Stage the desktop build
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: python release/stage.py upload --name "$STAGE" out/desktop-windows/*

  draft:
    needs: [verify, stage, server, server-install-test, desktop-linux, desktop-windows]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write   # only this job, only to create the draft release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Fetch every staged build
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 release/stage.py download --name "$STAGE" --dir builds
          rm -f builds/nuitka-report.xml   # reviewed in staging, never part of a release
      - name: Assemble and gate
        run: |
          python3 release/assemble.py --builds builds --out release-out \
            --version "${{ needs.verify.outputs.version }}" --tag "$GITHUB_REF_NAME" --commit "$GITHUB_SHA" \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --previous https://www.archymedes.xyz/downloads/argus/manifest.json
          cat release-out/release-report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Draft release (unsigned, unpublished)
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --draft --verify-tag \
            --title "Argus ${{ needs.verify.outputs.version }}" --notes-file release-out/release-report.md \
            release-out/*
          echo "Draft ready. A releaser signs it: python3 release/sign.py $GITHUB_REF_NAME" >> "$GITHUB_STEP_SUMMARY"

  # Whatever happened above, the staging draft goes: it is never published.
  cleanup:
    needs: [stage, server, server-install-test, desktop-linux, desktop-windows, draft]
    if: always() && needs.stage.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write   # delete the staging draft only
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 release/stage.py delete --name "$STAGE"
        env:
          GITHUB_TOKEN: ${{ github.token }}
