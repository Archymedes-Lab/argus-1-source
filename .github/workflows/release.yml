name: Release build

# Pushing a tag vYYYY.MM.DD[-N] on a commit of main builds a release. Nothing
# here can publish: the result is a DRAFT GitHub Release in this private
# repository, which a releaser checks and signs on their own machine
# (release/sign.py) before publishing it (publish.yml). Every build runs on a
# clean GitHub runner from the tagged commit only; no laptop builds ship.
#
# Stages: verify (static gate + unit suite) -> build (native server in the
# pinned manylinux_2_28 image, desktop for Linux and Windows) -> install test
# (the server package installed and run on a real systemd host) -> assemble
# (manifest, SHA256SUMS, report, SBOM, content gate) -> draft release.
#
# A push to a release-test/* branch runs every stage except the draft: a dry
# run for changing the build itself.
on:
  push:
    tags: ["v*"]
    branches: ["release-test/**"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  RUST_VERSION: "1.97.1"
  BUN_VERSION: "1.3.14"

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Tag names a version and a commit on main
        id: v
        run: |
          if [ "$GITHUB_REF_TYPE" != tag ]; then
            echo "dry run from $GITHUB_REF_NAME: no draft will be made"
            echo "version=$(date -u +%Y.%m.%d)-0" >> "$GITHUB_OUTPUT"; exit 0
          fi
          tag="$GITHUB_REF_NAME"
          [[ "$tag" =~ ^v20[0-9]{2}\.[01][0-9]\.[0-3][0-9](-[0-9]+)?$ ]] || { echo "tag $tag is not vYYYY.MM.DD[-N]"; exit 1; }
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "$GITHUB_SHA is not on main: merge first, then tag"; exit 1; }
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: Runtime dependencies (pinned by hash)
        run: python -m pip install --disable-pip-version-check --require-hashes -r release/requirements-runtime.txt
      - run: scripts/dev/static_gate.sh
      - run: python scripts/dev/ci_suite.py
      - name: Host-bound tests were run on their host and signed by a releaser
        if: github.ref_type == 'tag'
        env:
          ARGUS_RELEASE_SIGNERS: ${{ vars.ARGUS_RELEASE_SIGNERS }}
        run: python release/host_attest.py check

  # Builds pass between jobs through the Actions cache: it costs no account
  # storage and needs no write token. Each build job records its files'
  # SHA-256 as a job output, which only it can set; every consumer restores
  # the entry and checks it against those digests (release/digests.py).
  server:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    outputs:
      digests: ${{ steps.digests.outputs.server }}
      key: ${{ steps.digests.outputs.server_key }}
    env:
      # glibc 2.28: the program runs on RHEL 8+, Debian 10+, Ubuntu 20.04+. The
      # build runs in this image through `docker run`, not as a job container,
      # so the cache below is saved by the runner (a job container's cache uses
      # its own compression and cannot be restored on the runner).
      IMAGE: quay.io/pypa/manylinux_2_28_x86_64@sha256:4131ddd7acb9c6c966af02fe7e71edc51e078c2d41f475966697676430bfa2ae # 2026.10.10-1
      VERSION: ${{ needs.verify.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Native server program (in the pinned manylinux image, no network credentials)
        run: |
          docker run --rm -e VERSION -v "$PWD:/src" -w /src "$IMAGE" bash -euo pipefail -c '
            PY=/opt/python/cp312-cp312/bin/python
            git config --global --add safe.directory /src
            (cd /opt/_internal && tar xf static-libs-for-embedding-only.tar.xz)
            $PY -m pip install --disable-pip-version-check --require-hashes -r release/build-tools.txt
            $PY -m pip install --disable-pip-version-check --require-hashes --no-build-isolation -r release/requirements-build.txt
            $PY release/build_server.py --version "$VERSION" --out out/server --jobs 4
            chown -R '"$(id -u):$(id -g)"' out'
      - name: Record the build's digests
        id: digests
        run: python3 release/digests.py record out/server server
      - uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: out/server
          key: ${{ steps.digests.outputs.server_key }}
          enableCrossOsArchive: true

  server-install-test:
    needs: [verify, server]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: out/server
          key: ${{ needs.server.outputs.key }}
          enableCrossOsArchive: true
          fail-on-cache-miss: true
      - name: The packages are the ones the server build recorded
        env:
          DIGESTS: ${{ needs.server.outputs.digests }}
        run: |
          python3 release/digests.py verify out/server "$DIGESTS"
          mkdir -p server && cp out/server/*.tar.gz out/server/*.deb server/
      - name: Install, run, observe, remove (a real systemd host)
        run: sudo bash release/install_test.sh server/argus-server-linux-x86_64.tar.gz server/argus-server_*_amd64.deb

  desktop-linux:
    needs: verify
    outputs:
      digests: ${{ steps.digests.outputs.desktop_linux }}
      key: ${{ steps.digests.outputs.desktop_linux_key }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Toolchain and WebKitGTK
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustup default "$RUST_VERSION"
      - run: python3 release/build_desktop.py --platform linux --version "${{ needs.verify.outputs.version }}" --out out/desktop-linux
      - name: Record the build's digests
        id: digests
        shell: bash
        run: python3 release/digests.py record out/desktop-linux desktop_linux
      - uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: out/desktop-linux
          key: ${{ steps.digests.outputs.desktop_linux_key }}
          enableCrossOsArchive: true

  desktop-windows:
    needs: verify
    outputs:
      digests: ${{ steps.digests.outputs.desktop_windows }}
      key: ${{ steps.digests.outputs.desktop_windows_key }}
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Toolchain
        run: |
          rustup toolchain install $env:RUST_VERSION --profile minimal
          rustup default $env:RUST_VERSION
      - run: python release/build_desktop.py --platform windows --version "${{ needs.verify.outputs.version }}" --out out/desktop-windows
      - name: Record the build's digests
        id: digests
        shell: bash
        run: python release/digests.py record out/desktop-windows desktop_windows
      - uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: out/desktop-windows
          key: ${{ steps.digests.outputs.desktop_windows_key }}
          enableCrossOsArchive: true

  # Compile the installer script against a dummy folder before the long Nuitka
  # build starts: a script error is found in minutes, not after the compile.
  windows-nsis-check:
    needs: [verify]
    runs-on: windows-2025
    timeout-minutes: 15
    env:
      NSIS_VERSION: "3.11"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install NSIS
        shell: bash
        run: |
          choco install nsis --version "$NSIS_VERSION" -y --no-progress
          echo "C:\Program Files (x86)\NSIS" >> "$GITHUB_PATH"
      - name: Compile Argus-Setup.nsi against a stand-in folder
        shell: bash
        run: |
          mkdir stage && echo MZ > stage/argus.exe && echo MZ > stage/argus-desktop.exe
          makensis -V2 -NOCD -DVERSION=0.0.0 -DPRODUCT_VERSION=0.0.0.0 \
            "-DSRC=$PWD/stage" "-DOUTFILE=$PWD/check-setup.exe" release/windows/Argus-Setup.nsi
          ls -l check-setup.exe

  # The one Windows download: the desktop app and the compiled monitoring program
  # in a single installer (release/build_windows.py). The first build compiles
  # the whole program with Nuitka and takes a long time; the compiler downloads
  # are cached, keyed on the pinned inputs, so later builds are shorter. The
  # output does not depend on the cache: the cache holds only downloaded tools.
  windows-installer:
    needs: [verify, desktop-windows, windows-nsis-check]
    outputs:
      digests: ${{ steps.digests.outputs.windows_installer }}
      key: ${{ steps.digests.outputs.windows_installer_key }}
    runs-on: windows-2025
    timeout-minutes: 180
    env:
      VERSION: ${{ needs.verify.outputs.version }}
      NSIS_VERSION: "3.11"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: out/desktop-windows
          key: ${{ needs.desktop-windows.outputs.key }}
          enableCrossOsArchive: true
          fail-on-cache-miss: true
      - name: The desktop app is the one its build recorded
        shell: bash
        env:
          DIGESTS: ${{ needs.desktop-windows.outputs.digests }}
        run: python release/digests.py verify out/desktop-windows "$DIGESTS"
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            ~\AppData\Local\Nuitka
            ~\AppData\Local\Microsoft\Windows\INetCache\nuitka
          key: nuitka-win-${{ hashFiles('release/requirements-windows.txt', 'release/build-tools.txt', 'release/build_windows.py') }}
      - name: Build tools (pinned by hash) and NSIS
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check --require-hashes -r release/build-tools.txt
          python -m pip install --disable-pip-version-check --require-hashes --no-build-isolation -r release/requirements-windows.txt
          choco install nsis --version "$NSIS_VERSION" -y --no-progress
          echo "C:\Program Files (x86)\NSIS" >> "$GITHUB_PATH"
      - name: Compile the daemon, pack Argus-Setup.exe, run the content gate
        shell: bash
        run: |
          # Only a dry run (release-test/*) may load the policy proposal. A tagged
          # build uses the committed policy, which has no rule for the installer
          # until release/proposals/windows-installer.json has been reviewed.
          extra=""
          case "$GITHUB_REF" in refs/heads/release-test/*) extra="--proposal release/proposals/windows-installer.json --proposal release/proposals/windows-markers.json";; esac
          python release/build_windows.py --version "$VERSION" --out out/windows-installer \
            --desktop out/desktop-windows --jobs 4 $extra
      # Dry runs only (release-test/* branches, never a tag): keep the installer and
      # the build log for one day as a private artifact so it can be tried on a
      # clean machine. This is for inspection, not distribution; a tagged release
      # never uploads anything here and is published only by the signed path.
      - name: Keep the installer for inspection (dry run, private, 1 day)
        if: always() && startsWith(github.ref, 'refs/heads/release-test/')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: argus-setup-dry-run
          path: |
            out/windows-installer/Argus-Setup.exe
            out/windows-installer/windows-installer-build.json
            out/windows-installer/nuitka-windows-report.xml
          retention-days: 1
          if-no-files-found: warn
      - name: Record the build's digests
        id: digests
        shell: bash
        run: python release/digests.py record out/windows-installer windows_installer
      - uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: out/windows-installer
          key: ${{ steps.digests.outputs.windows_installer_key }}
          enableCrossOsArchive: true

  # A fresh runner stands in for a clean machine: download -> install -> open ->
  # monitoring data -> crash recovery -> upgrade -> uninstall, with no manual step
  # (release/windows/install_test.py). It is not a substitute for one look at a
  # real clean PC before the first public release (docs/guides/RELEASING.md).
  windows-install-test:
    needs: [windows-installer]
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: out/windows-installer
          key: ${{ needs.windows-installer.outputs.key }}
          enableCrossOsArchive: true
          fail-on-cache-miss: true
      - name: The installer is the one the build recorded
        shell: bash
        env:
          DIGESTS: ${{ needs.windows-installer.outputs.digests }}
        run: python release/digests.py verify out/windows-installer "$DIGESTS"
      - name: Install, pair, monitor, crash, recover, upgrade, uninstall
        run: python release/windows/install_test.py out/windows-installer/Argus-Setup.exe

  draft:
    needs: [verify, server, server-install-test, desktop-linux, desktop-windows, windows-installer, windows-install-test]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write   # only this job, only to create the draft release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: out/server
          key: ${{ needs.server.outputs.key }}
          enableCrossOsArchive: true
          fail-on-cache-miss: true
      - uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: out/desktop-linux
          key: ${{ needs.desktop-linux.outputs.key }}
          enableCrossOsArchive: true
          fail-on-cache-miss: true
      - uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: out/desktop-windows
          key: ${{ needs.desktop-windows.outputs.key }}
          enableCrossOsArchive: true
          fail-on-cache-miss: true
      - uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: out/windows-installer
          key: ${{ needs.windows-installer.outputs.key }}
          enableCrossOsArchive: true
          fail-on-cache-miss: true
      - name: Every file is exactly what its build recorded
        env:
          INSTALLER: ${{ needs.windows-installer.outputs.digests }}
          SERVER: ${{ needs.server.outputs.digests }}
          LINUX: ${{ needs.desktop-linux.outputs.digests }}
          WINDOWS: ${{ needs.desktop-windows.outputs.digests }}
        run: |
          python3 release/digests.py verify out/server "$SERVER"
          python3 release/digests.py verify out/desktop-linux "$LINUX"
          python3 release/digests.py verify out/desktop-windows "$WINDOWS"
          python3 release/digests.py verify out/windows-installer "$INSTALLER"
      - name: Assemble and gate
        run: |
          # Only a dry run (release-test/*) may load the policy proposal; a tagged
          # build is held to the committed policy.
          extra=""
          case "$GITHUB_REF" in refs/heads/release-test/*) extra="--proposal release/proposals/windows-installer.json --proposal release/proposals/windows-markers.json";; esac
          python3 release/assemble.py --builds out --out release-out $extra \
            --version "${{ needs.verify.outputs.version }}" --tag "$GITHUB_REF_NAME" --commit "$GITHUB_SHA" \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --previous https://www.archymedes.xyz/downloads/argus/manifest.json
          cat release-out/release-report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Manifest, checksums and file names agree with the artifacts
        run: python3 release/verify_release.py release-out --version "${{ needs.verify.outputs.version }}"
      - name: Draft release (unsigned, unpublished)
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --draft --verify-tag \
            --title "Argus ${{ needs.verify.outputs.version }}" --notes-file release-out/release-report.md \
            release-out/*
          echo "Draft ready. A releaser signs it: python3 release/sign.py $GITHUB_REF_NAME" >> "$GITHUB_STEP_SUMMARY"
