name: Live detection run

# Started by a person, never by a push. On a GitHub-hosted runner (a virtual machine
# that is destroyed afterwards) a fixed list of local, reversible attacker actions is
# carried out for real, and reviewed Linux observation collectors is asked what it saw
# (scripts/security/live_bench.py). Nothing is downloaded by the actions and nothing
# leaves the runner. A measurement: it does not gate a release. CI minutes are a
# budget, so this is not scheduled.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Runtime dependencies (pinned by hash)
        run: python -m pip install --disable-pip-version-check --require-hashes -r release/requirements-runtime.txt
      - name: Real actions, then reviewed collectors
        run: |
          # No external network in the attack/collector phase. Dependencies were installed above.
          sudo unshare --net -- env JARVIS_ARENA_SANDBOX=1 "$(command -v python)" scripts/security/live_bench.py --json "$RUNNER_TEMP/live.json" | tee "$RUNNER_TEMP/live.txt"
          { echo '```'; cat "$RUNNER_TEMP/live.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve measurement, including failed runs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: live-detection-evidence
          path: |
            ${{ runner.temp }}/live.json
            ${{ runner.temp }}/live.txt
          retention-days: 14
