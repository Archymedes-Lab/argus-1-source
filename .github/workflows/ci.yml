name: CI

# Every push and pull request: the static gate (ruff, mypy, property checks
# and model checking), the full unit suite, the release tooling's own tests
# and the desktop interface tests. A release tag runs these again before any
# build (release.yml), so nothing ships that CI has not passed.
on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: Runtime dependencies (pinned by hash)
        run: python -m pip install --disable-pip-version-check --require-hashes -r release/requirements-runtime.txt
      - name: Static gate
        run: scripts/dev/static_gate.sh
      - name: Release tooling (content gate, signatures, launcher)
        run: python -m unittest tests.test_release_gate tests.test_release_signing tests.test_release_keys tests.test_release_version tests.test_host_attest tests.test_release_stage tests.test_server_launcher -v
      - name: Unit suite
        run: python scripts/dev/ci_suite.py

  desktop-ui:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - name: Interface tests and build
        working-directory: desktop/ui
        run: |
          bun install --frozen-lockfile
          bun run test
          bun run build
